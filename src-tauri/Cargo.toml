[package]
name = "letterflow"
version = "0.1.0"
description = "Local AI-assisted email campaign builder"
authors = ["letterflow contributors"]
license = "MIT"
repository = "https://github.com/tereza-vac/letterflow"
edition = "2021"
rust-version = "1.77.2"

# The `_lib` suffix avoids a name clash with the binary on Windows.
[lib]
name = "letterflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SMTP test sending. rustls avoids native OpenSSL build headaches on Windows.
lettre = { version = "0.11", default-features = false, features = [
  "smtp-transport",
  "tokio1-rustls-tls",
  "builder",
  "tokio1",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# OS credential store for API keys / SMTP passwords.
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }

[features]
# This feature is used for production builds where `devUrl` is unset.
custom-protocol = ["tauri/custom-protocol"]
